# thumbd — persistent thumbnail daemon
# Minimal example. Map ONE media folder as /data and you are done.
# Uses the prebuilt multi-arch image from GitHub Container Registry (amd64 + arm64).

services:
  thumbd:
    image: ghcr.io/mayrd/thumbd:latest
    container_name: thumbd
    restart: unless-stopped
    ports:
      - "8090:8090"          # use internally (behind nginx auth_request) or localhost only
    environment:
      # THUMBD_ROOTS = which paths INSIDE the container may be served (whitelist).
      # It must match the mount below: a file is only served if it is under one of
      # these roots. Keep it simple: mount your folder as /data and use "/data".
      THUMBD_ROOTS: "/data"
      # Token for request auth (empty = no auth — ONLY use behind nginx auth_request!)
      THUMBD_TOKEN: "${THUMBD_TOKEN:-}"
      # The daemon drops to this uid:gid after startup (via su-exec). Set it to your
      # HOST user's uid:gid (default 1000:1000 = typical first user on a Pi) so file
      # permissions on the mounted media work without chmod gymnastics.
      THUMBD_UID: "1000"
      THUMBD_GID: "1000"
    volumes:
      # >>> Your media folder, mounted read-only (thumbd never writes to sources) <<<
      - /home/USER:/data:ro
      - thumbd-cache:/cache   # thumbnail cache (writable)

    # --- OPTIONAL: hardware video decode (Raspberry Pi 5, HEVC only) ---
    # Without this, videos are decoded in software — works everywhere, a bit slower.
    # The Pi 5 has no HW H.264 decoder, so H.264 is always software regardless.
    # Only add these lines if you decode HEVC content on a Pi 5:
    # group_add:
    #   - "44"                        # host group 'video'
    # devices:
    #   - /dev/video19:/dev/video19  # rpi-hevc-dec (HEVC decoder)
    #   - /dev/media0:/dev/media0    # media controller for the decoder

volumes:
  thumbd-cache:
